name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Build standalone package
        run: npm run package

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Neo Astra $tag" --notes "Neo Astra $tag" || true
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Build npm platform package
        run: node scripts/package-npm.mjs --platform

      - name: Publish npm platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping npm platform publish."
            exit 0
          fi
          package_dir=dist/npm/platform
          name=$(node -p "require('./$package_dir/package.json').name")
          version=$(node -p "require('./$package_dir/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published."
            exit 0
          fi
          npm publish "$package_dir" --access public --tag latest

  meta:
    name: npm meta package
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build npm meta package
        run: node scripts/package-npm.mjs --meta

      - name: Publish npm meta package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping npm meta publish."
            exit 0
          fi
          package_dir=dist/npm/meta
          name=$(node -p "require('./$package_dir/package.json').name")
          version=$(node -p "require('./$package_dir/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published."
            exit 0
          fi
          npm publish "$package_dir" --access public --tag latest
