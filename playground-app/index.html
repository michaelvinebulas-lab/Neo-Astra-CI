<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neo Astra Playground</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
      }
      .header h1 { font-size: 18px; margin: 0; }
      .badge {
        font-size: 12px;
        color: #8b949e;
        border: 1px solid #30363d;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 320px;
        gap: 12px;
        padding: 12px;
        min-height: calc(100vh - 130px);
      }
      .panel {
        border: 1px solid #30363d;
        border-radius: 8px;
        background: #161b22;
        padding: 12px;
        min-width: 0;
      }
      .panel h2 { font-size: 14px; margin: 0 0 8px; }
      .file-list, .diagnostics { list-style: none; padding: 0; margin: 0 0 12px; }
      .file-button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        padding: 6px 8px;
        cursor: pointer;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .file-button:hover { background: #21262d; }
      .file-button.active { background: #1f6feb; color: #fff; }
      .button-row { display: flex; flex-wrap: wrap; gap: 6px; }
      button {
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #21262d;
        color: inherit;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { border-color: #8b949e; }
      .editor-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .active-path { flex: 1; font-family: ui-monospace, monospace; font-size: 13px; color: #8b949e; }
      .editor {
        width: 100%;
        height: calc(100vh - 210px);
        min-height: 420px;
        resize: vertical;
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 12px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.5;
      }
      .issue { font-size: 12px; margin-bottom: 6px; color: #f85149; }
      .issue code { color: #ff7b72; margin-right: 6px; }
      .ok { font-size: 12px; color: #3fb950; list-style: none; }
      .lock-output {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 8px;
        max-height: 300px;
        overflow: auto;
      }
      .status {
        padding: 8px 16px;
        border-top: 1px solid #30363d;
        font-size: 12px;
        color: #8b949e;
      }
      .status.error { color: #f85149; }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
