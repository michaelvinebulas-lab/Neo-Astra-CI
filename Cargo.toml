[workspace]
members = [
  "crates/astra-core",
  "crates/astra-capabilities",
  "crates/astra-nova",
  "crates/astra-compiler-api",
  "crates/astra-wasm",
  "crates/astra-codegen-c",
  "crates/astra-codegen-wasm",
  "crates/astra-codegen-llvm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
astra-core = { path = "crates/astra-core" }
astra-capabilities = { path = "crates/astra-capabilities" }
astra-nova = { path = "crates/astra-nova" }
astra-compiler-api = { path = "crates/astra-compiler-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
